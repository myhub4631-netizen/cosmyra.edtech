name: cosmyra_exam_app
description: "Cosmyra AI-Powered Question Practice & Exam Preparation Platform (Native Flutter Mobile App)"
publish_to: 'none'
version: 1.2.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.3.4
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  flutter_math_fork: ^0.7.2
  fl_chart: ^0.66.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
