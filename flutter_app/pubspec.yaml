name: cosmyra_edu_flutter
description: "Cosmyra Edu Flutter - AI-Powered NEET & JEE Exam Prep Platform"
publish_to: 'none'
version: 1.1.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.3.4
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  flutter_math_fork: ^0.7.2
  fl_chart: ^0.66.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.3.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
